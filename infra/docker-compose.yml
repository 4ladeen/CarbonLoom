version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 with pgvector & RLS
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: carbonloom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carbonloom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carbonloom_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-carbonloom_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../services/api/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonloom -d carbonloom_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. TimescaleDB (Time-series meter telemetry)
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: carbonloom-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TIMESCALE_USER:-carbonloom_ts}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-timescale_secret_2026}
      POSTGRES_DB: ${TIMESCALE_DB:-carbonloom_telemetry}
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ../services/api/db/timescaledb_migration.sql:/docker-entrypoint-initdb.d/01_migration.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonloom_ts -d carbonloom_telemetry"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. Neo4j (Regulatory & Factory Topology Knowledge Graph)
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.20-community
    container_name: carbonloom-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/carbonloom_neo4j_2026}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  # ---------------------------------------------------------------------------
  # 4. MinIO (S3-Compatible Object Store with AES-256)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: carbonloom-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ---------------------------------------------------------------------------
  # 5. Redis (Cache, Rate Limits & Token Spend Caps)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: carbonloom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ---------------------------------------------------------------------------
  # 6. NATS Event Streaming
  # ---------------------------------------------------------------------------
  nats:
    image: nats:2.10-alpine
    container_name: carbonloom-nats
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"

  # ---------------------------------------------------------------------------
  # 7. Core FastAPI Deterministic Engine & API
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../
      dockerfile: services/api/Dockerfile
    container_name: carbonloom-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://carbonloom:carbonloom_secret_2026@postgres:5432/carbonloom_db
      TIMESCALE_URL: postgresql://carbonloom_ts:timescale_secret_2026@timescaledb:5432/carbonloom_telemetry
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: carbonloom_neo4j_2026
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started

  # ---------------------------------------------------------------------------
  # 8. Zero-Trust Go MCP Gateway
  # ---------------------------------------------------------------------------
  mcp-gateway:
    build:
      context: ../services/mcp-gateway-go
      dockerfile: Dockerfile
    container_name: carbonloom-mcp-gateway
    restart: unless-stopped
    environment:
      PORT: 8080
      JWT_SECRET: carbonloom_super_secret_jwt_key_2026
      REDIS_URL: redis:6379
      API_BACKEND_URL: http://api:8000
    ports:
      - "8080:8080"
    depends_on:
      - api
      - redis

volumes:
  postgres_data:
  timescaledb_data:
  neo4j_data:
  minio_data:
  redis_data:
