<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" fill="none" aria-label="CarbonLoom Logo">
  <defs>
    <linearGradient id="cl-em-grad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cl-text-grad" x1="110" y1="30" x2="350" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark Graphic -->
  <g transform="translate(10, 10) scale(0.666)">
    <!-- Hexagon Outer Lattice -->
    <polygon points="60,14 100,37 100,83 60,106 20,83 20,37" 
             stroke="url(#cl-em-grad)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Warp Threads -->
    <line x1="44" y1="28" x2="44" y2="92" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 3"/>
    <line x1="60" y1="20" x2="60" y2="100" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="76" y1="28" x2="76" y2="92" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 3"/>

    <!-- Weft Threads -->
    <path d="M30 46 H90" stroke="url(#cl-em-grad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M26 60 H94" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
    <path d="M30 74 H90" stroke="url(#cl-em-grad)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Central Verification Anchor Node -->
    <circle cx="60" cy="60" r="8" fill="#090d16" stroke="url(#cl-em-grad)" stroke-width="3"/>
    <circle cx="60" cy="60" r="3" fill="#34d399"/>

    <!-- Lattice Vertices -->
    <circle cx="60" cy="14" r="3" fill="#34d399"/>
    <circle cx="100" cy="37" r="3" fill="#10b981"/>
    <circle cx="100" cy="83" r="3" fill="#10b981"/>
    <circle cx="60" cy="106" r="3" fill="#059669"/>
    <circle cx="20" cy="83" r="3" fill="#10b981"/>
    <circle cx="20" cy="37" r="3" fill="#34d399"/>
  </g>

  <!-- Typography Wordmark -->
  <text x="105" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em" fill="url(#cl-text-grad)">Carbon<tspan fill="#10b981" font-weight="600">Loom</tspan></text>
  <text x="106" y="78" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="0.08em" fill="#64748b">DECARBONIZATION OS</text>
</svg>
