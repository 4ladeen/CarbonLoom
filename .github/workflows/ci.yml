name: CarbonLoom CI / Eval Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    name: Python Deterministic Carbon & Sim Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt pytest-cov
      - name: Run Deterministic Carbon Math Unit Tests
        run: |
          pytest services/api/tests/ -v --cov=services/api
      - name: Run Digital Twin Simulator Tests
        run: |
          pytest sim/tests/ -v
      - name: Run Invariant, Circuit & Fabric Ledger Tests
        run: |
          pytest circuits/ fabric/ eval/ services/agents/ -v

  go-gateway-tests:
    name: Go MCP Gateway Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/mcp-gateway-go/go.sum
      - name: Test Go Gateway
        run: |
          cd services/mcp-gateway-go
          go test -v ./...

  frontend-checks:
    name: Frontend Quality & Hallmark Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci || npm install
      - name: TypeScript Type Check
        run: npm run typecheck
      - name: Check TypeScript Build
        run: npm run build
